<div class="grid">

        <header>Devices</header>
        <p><strong>{{ online_count }}</strong> / {{ devices|length }} devices online</p>
        <footer><a href="/ui/devices" role="button" class="outline">View Devices</a></footer>
    </article>
    <article>
        <header>Scenarios</header>
        <p><strong>{{ active_scenarios }}</strong> / {{ scenarios_count }} running</p>
        <footer><a href="/ui/scenarios" role="button" class="outline">View Scenarios</a></footer>

    <article>
        <header>Alarms</header>
        <p><strong>{{ alarm_count }}</strong> active alarms</p>
        <footer><a href="/ui/events" role="button" class="outline">View Events</a></footer>
