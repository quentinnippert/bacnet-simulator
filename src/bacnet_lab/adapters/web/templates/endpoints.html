{% extends "base.html" %}
{% block title %}Endpoints — BACnet Lab{% endblock %}
{% block content %}
<h1>Webhook Endpoints</h1>
<article>
    <form data-api="/api/endpoints">
        <label for="url">Webhook URL (host must be allowed in server configuration)</label>
        <input type="url" id="url" name="url" placeholder="http://localhost:9000/webhook" required>
        <button type="submit">Create Endpoint</button>
    </form>
    <p id="created-secret" role="status" hidden></p>
</article>
<div hx-get="/ui/partials/endpoints" hx-trigger="endpoints-changed from:body" hx-swap="innerHTML">
{% include "partials/endpoint_cards.html" %}
</div>
{% endblock %}
