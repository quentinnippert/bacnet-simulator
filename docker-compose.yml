services:
  bacnet-lab:
    build: .
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      BACNET_LAB_DB_PATH: /app/data/bacnet_lab.db
    volumes:
      - bacnet-data:/app/data
      - ./config:/app/config:ro
    restart: unless-stopped
    stop_grace_period: 30s
volumes:
  bacnet-data:
